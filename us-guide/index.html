lient.py","manage_run_state.py","normalize_estimates.py","pipeline_common.py","pipeline_discover.py","pipeline_enrichment.py","pipeline_snapshot.py","pipeline_universe.py","prepublish_audit.py","research_contract.py","run_pipeline.py","screen_universe.py","screening_semantics.py","skill_version.py"],"tier":"D","optional_keys":["fmp"],"verified":{"passed":4,"applicable":6},"audience":"trader","us_equity":true,"links":{"skill_md":"https://github.com/siegfydj/claude-trading-skills/blob/main/skills/us-undervalued-growth-screener/SKILL.md","doc_en":"https://github.com/siegfydj/claude-trading-skills/blob/main/docs/en/skills/us-undervalued-growth-screener.md"}}],"workflows":[{"id":"core-portfolio-weekly","name":"Core Portfolio Weekly","cadence":"weekly","minutes":60,"difficulty":"beginner","api_profile":"alpaca-required","when_to_run":"Once per week, typically on Saturday or Sunday before next week's market open. Reviews long-term holdings, dividend positions, and overall allocation.","when_not_to_run":"Do not run as a daily routine. Daily portfolio churn defeats the long-term framing of this workflow.","required_skills":["portfolio-manager","trader-memory-core"],"optional_skills":["kanchi-dividend-review-monitor","value-dividend-screener","kanchi-dividend-us-tax-accounting"],"steps":[{"step":1,"name":"Fetch holdings snapshot","skill":"portfolio-manager","optional":false,"decision_gate":false,"question":""},{"step":2,"name":"Review allocation and concentration","skill":"portfolio-manager","optional":false,"decision_gate":true,"question":"Before allocation review, run portfolio-manager/scripts/reconcile_positions.py on complete, same-account broker and ACTIVE / PARTIALLY_CLOSED memory snapshots per portfolio-manager/references/position-reconciliation.md. Retain the JSON and Markdown reconciliation_report. Stop here if can_continue is false or completeness, account attribution or freshness is unresolved. After a verified match, are sector and single-name concentrations within target bands? If not, what specific reallocation does the trader propose?"},{"step":3,"name":"Check dividend health (T1-T5 anomaly check)","skill":"kanchi-dividend-review-monitor","optional":true,"decision_gate":false,"question":""},{"step":4,"name":"Decide rebalance actions","skill":"portfolio-manager","optional":false,"decision_gate":true,"question":"Which rebalance actions (if any) will be executed next week? Confirm explicit buy / sell / hold list with sizing."},{"step":5,"name":"Journal the weekly review","skill":"trader-memory-core","optional":false,"decision_gate":false,"question":""}],"manual_review":["Require a verified reconciliation_report before allocation or rebalance review; resolve discrepancies manually and rerun the comparison.","Reconciliation is currently a manual gate; historical replay fixtures do not execute or enforce it.","Confirm holdings snapshot reflects the actual brokerage state (Alpaca or CSV).","Confirm rebalance actions are entered manually at the broker, not auto-executed.","If dividend_review_findings flags T1-T5 issues, defer additional buys until resolved."]},{"id":"earnings-weekly","name":"Earnings Momentum Weekly","cadence":"weekly","minutes":60,"difficulty":"intermediate","api_profile":"fmp-required","when_to_run":"Weekly during earnings season, after market-regime-daily has produced a non-restrictive exposure decision. Score recent US earnings reactions across the PEAD watch window of about five weeks, screen the strongest names for post-earnings-drift (PEAD) weekly-candle setups, confirm the chart by hand, size the position, and journal the candidate before any manual order.","when_not_to_run":"Do not run when the latest market-regime-daily exposure_decision is cash-priority or restrictive, or when the account circuit breaker is not clear. Do not use it to chase a Day 1 earnings gap; that is stockbee-ep-daily's job. It is not a standalone screener: a score or stage is never a buy signal, and no order is placed automatically.","required_skills":["earnings-trade-analyzer","pead-screener","drawdown-circuit-breaker","technical-analyst","position-sizer","trader-memory-core","pre-trade-discipline-gate"],"optional_skills":[],"steps":[{"step":1,"name":"Check account circuit breaker","skill":"drawdown-circuit-breaker","optional":false,"decision_gate":true,"question":"Is the account circuit breaker clear (TRADING_ALLOWED) for new earnings-momentum risk this week?"},{"step":2,"name":"Score recent earnings reactions","skill":"earnings-trade-analyzer","optional":false,"decision_gate":false,"question":""},{"step":3,"name":"Screen graded candidates for PEAD weekly setups","skill":"pead-screener","optional":false,"decision_gate":true,"question":"Which graded names are in a BREAKOUT or SIGNAL_READY stage worth a chart review, and which MONITORING or EXPIRED names stay on the watchlist or are dropped? Was the screener run in Mode B on step 2's JSON with a minimum grade chosen on purpose?"},{"step":4,"name":"Confirm the weekly chart by hand","skill":"technical-analyst","optional":false,"decision_gate":true,"question":"Does the weekly chart confirm a clean post-earnings drift with the red candle low as a sensible stop, acceptable liquidity, and no thesis-breaking news? Reject any setup where the chart is unclear even if the stage and score look good."},{"step":5,"name":"Calculate position size","skill":"position-sizer","optional":false,"decision_gate":false,"question":""},{"step":6,"name":"Register the earnings-drift thesis","skill":"trader-memory-core","optional":false,"decision_gate":true,"question":"Which validated names deserve a registered earnings-drift thesis with the written entry, stop, and size, and which stay on the watchlist? A registered thesis is IDEA only; it is not an order approval."},{"step":7,"name":"Run manual execution discipline gate","skill":"pre-trade-discipline-gate","optional":false,"decision_gate":true,"question":"Before placing any manual broker order, does each actionable candidate pass the written-plan, predefined-stop, position-size, recent-loss, market-regime, and circuit-breaker discipline checks? Treat watchlist names as no-action journal entries, not order approvals."}],"manual_review":["Confirm market-regime-daily exposure_decision allows new risk before acting.","Confirm circuit_breaker_decision is TRADING_ALLOWED before scoring or sizing new candidates.","Verify each earnings result and any guidance by hand; this workflow does not discover or validate the news itself.","Run earnings-trade-analyzer with a lookback long enough to cover the PEAD watch window (about 28 to 35 days); a one-week lookback only finds names too young to show a red candle. Set --max-api-calls explicitly, and consider --min-market-cap: the analyzer's default budget is 200 calls, its client spends one request per calendar day of the window plus one per reporting symbol before the market-cap filter, and PEAD spends one per candidate, so a long window can exhaust the default and exit with ZERO_RESULT_REASON=profiles_budget_exhausted. The call volume a live run needs, and whether your FMP plan quota covers it, are unmeasured here; check your plan.","Run pead-screener in Mode B on step 2's JSON. Mode A can spend the API budget on non-US listings and is not part of this routine.","Treat MONITORING and EXPIRED stages as watchlist or drop; only BREAKOUT and SIGNAL_READY names reach chart review.","Reject any candidate where the weekly chart is unclear, even if the earnings grade and PEAD stage passed.","Use the red candle low as the stop only when the distance is realistically sizeable; verify total portfolio heat before any order.","Confirm pre_trade_discipline_decision is GO before placing any manual broker order.","All orders are placed manually at the broker; no auto-execution."]},{"id":"kanchi-dividend-weekly","name":"Kanchi Dividend Weekly","cadence":"weekly","minutes":60,"difficulty":"intermediate","api_profile":"mixed","when_to_run":"Weekly, to source and underwrite new US-listed dividend candidates using Kanchi's 5-step method: screen for yield/quality, deep-dive the strongest names, and register a fully-documented candidate thesis before any entry. v1 covers US-listed dividend stocks only.","when_not_to_run":"Not for Japanese or other non-US-listed dividend stocks -- this workflow neither covers nor implies support for them in v1. Not a claim that Kanchi-style screening is a profitable strategy; it is a disciplined candidate-sourcing routine, not a signal to buy. Not for maintaining an existing holding -- that is core-portfolio-weekly's job (this workflow is for finding and underwriting NEW candidates). No order is ever placed automatically; every buy is entered manually at the broker.","required_skills":["kanchi-dividend-sop","trader-memory-core"],"optional_skills":["value-dividend-screener","dividend-growth-pullback-screener","kanchi-dividend-us-tax-accounting","kanchi-dividend-review-monitor"],"steps":[{"step":1,"name":"Screen for high-yield candidates","skill":"value-dividend-screener","optional":true,"decision_gate":false,"question":""},{"step":2,"name":"Screen for dividend-growth pullbacks","skill":"dividend-growth-pullback-screener","optional":true,"decision_gate":false,"question":""},{"step":3,"name":"Run the Kanchi 5-step underwriting","skill":"kanchi-dividend-sop","optional":false,"decision_gate":true,"question":"For each candidate, does the Kanchi verdict reach an actionable tier (CLEAN-PASS / PASS-CAUTION / CONDITIONAL-PASS)? A HOLD-REVIEW, STEP1-RECHECK, or FAIL verdict is fail-closed -- it stops here, not forward to sizing or registration. Candidates may come from step 1/2 screeners (use if available) or a manually supplied ticker list -- neither screener is required to run this step."},{"step":4,"name":"Check US tax and account-location treatment","skill":"kanchi-dividend-us-tax-accounting","optional":true,"decision_gate":false,"question":""},{"step":5,"name":"Check existing-holding review triggers","skill":"kanchi-dividend-review-monitor","optional":true,"decision_gate":false,"question":""},{"step":6,"name":"Register the candidate thesis","skill":"trader-memory-core","optional":false,"decision_gate":true,"question":"For each actionable candidate, ingest the kanchi_candidates verdict as an IDEA thesis, then link the saved stock_memo file (and, if available, tax/account-location advice and any review-monitor flags) to it with thesis_store.link_report() so the fully-documented Kanchi memo is part of the auditable record, not just referenced in prose. Confirm no unresolved blockers, sizing, sector concentration, and tranche plan before entering an order. Never transition the thesis to ACTIVE until a real broker fill happens -- this step only reaches IDEA / ENTRY_READY."}],"manual_review":["A HOLD-REVIEW, STEP1-RECHECK, or FAIL Kanchi verdict is fail-closed -- it never advances to sizing or thesis registration.","The step-3 stock memo (`references/stock-note-template.md` in kanchi-dividend-sop, a hand-written one-pager) is not embedded in the kanchi_candidates JSON -- save it to a file, then after the IDEA thesis is registered, call `thesis_store.link_report(state_dir, thesis_id, \"kanchi-dividend-sop\", <memo_path>, date)` to attach it. Without this call the thesis has no documented memo in its `linked_reports`, even though one was written.","No order is ever placed automatically, and the thesis never auto-transitions to ACTIVE; every fill is entered manually at the broker, then recorded with open-position.","Screeners (steps 1-2) are optional -- a manually supplied ticker list is an equally valid path into step 3.","Tax and account-location advice (step 4) is advisory, not authoritative -- verify with a tax professional or the actual broker/custodian statements before acting on it.","Step 4 requires `tax_holdings_input` matching the linked schema; do not pass raw screener rows directly as tax holdings.","If review-monitor (step 5) flags an existing holding WARN or REVIEW, that only pauses additional buys in that name -- it never triggers an automatic sell.","Step 5 requires `review_monitor_input` matching its richer linked schema; a ticker-only candidate is insufficient and the optional step must be skipped rather than manufacturing missing evidence.","Screener outputs land under each skill's own `logs/` directory, not a shared `reports/` path; treat artifact ids as logical references, not literal filenames, when wiring steps together.","Command examples for dividend-growth-pullback-screener must use `screen_dividend_growth_rsi.py` -- `screen_dividend_growth.py` does not exist in this repository."]},{"id":"market-regime-daily","name":"Market Regime Daily","cadence":"daily","minutes":15,"difficulty":"beginner","api_profile":"mixed","when_to_run":"Before considering new swing-trade risk for the day. Run before market open or in the first 30 minutes after.","when_not_to_run":"Do not use this output as a standalone buy/sell signal. The exposure_decision is a posture (allow / restrict / cash-priority), not a directive.","required_skills":["market-breadth-analyzer","uptrend-analyzer","exposure-coach"],"optional_skills":["market-top-detector","macro-regime-detector"],"steps":[{"step":1,"name":"Analyze market breadth","skill":"market-breadth-analyzer","optional":false,"decision_gate":false,"question":""},{"step":2,"name":"Analyze uptrend participation","skill":"uptrend-analyzer","optional":false,"decision_gate":false,"question":""},{"step":3,"name":"Check market top risk (optional FMP key required)","skill":"market-top-detector","optional":true,"decision_gate":false,"question":""},{"step":4,"name":"Decide exposure posture","skill":"exposure-coach","optional":false,"decision_gate":true,"question":"Given today's breadth, uptrend participation, and top risk, is new swing trade risk allowed, restricted, or cash-priority?"}],"manual_review":["Confirm output is not used as a buy/sell signal.","Confirm whether exposure should be reduced, unchanged, or increased.","If exposure_decision is restrictive, defer running swing-opportunity-daily."]},{"id":"monthly-performance-review","name":"Monthly Performance Review","cadence":"monthly","minutes":90,"difficulty":"intermediate","api_profile":"no-api-basic","when_to_run":"First weekend of each month, reviewing the prior month's closed positions, open thesis health, and process improvements. Closes the Plan -> Trade -> Record -> Review -> Improve loop.","when_not_to_run":"Do not skip this review even in losing months — that is when it matters most. Do not run weekly; the monthly cadence is intentional to filter noise.","required_skills":["trader-memory-core","signal-postmortem"],"optional_skills":["trade-performance-coach","backtest-expert","dual-axis-skill-reviewer"],"steps":[{"step":1,"name":"Aggregate the month's trades and theses","skill":"trader-memory-core","optional":false,"decision_gate":false,"question":""},{"step":2,"name":"Pattern-level postmortem across the month","skill":"signal-postmortem","optional":false,"decision_gate":true,"question":"What recurring patterns appear across the month's outcomes? Classify by thesis quality, execution, market environment, and randomness."},{"step":3,"name":"Coach monthly process, risk, and behavior patterns","skill":"trade-performance-coach","optional":true,"decision_gate":true,"question":"Which next-month operating rules should be accepted, modified, deferred, or journaled only?"},{"step":4,"name":"Re-validate hypotheses via backtest","skill":"backtest-expert","optional":true,"decision_gate":false,"question":""},{"step":5,"name":"Review which skills helped or hurt","skill":"dual-axis-skill-reviewer","optional":true,"decision_gate":false,"question":""},{"step":6,"name":"Produce decision log and rule changes","skill":"trader-memory-core","optional":false,"decision_gate":true,"question":"Based on this month's evidence, what specific rules will change next month? Record the coach accept/modify/defer/journal-only decision when coaching ran; final approval preserves that decision without activating rules. Trade-side rules vs repo-side improvements should stay separate."}],"manual_review":["Distinguish process improvements (rule changes) from outcome accidents (randomness).","Trade-side rule changes apply to the trader's behavior next month.","Skill-side improvements are repo-improvement candidates and may or may not be acted on.","Be willing to delete or downgrade rules that aren't working — not just add new ones.","The step-6 artifact does not activate rules; activation is the explicit `manage_approved_rules.py activate` follow-up in pre-trade-discipline-gate.","Before step 6, run `review_rule_adherence.py --month <month>` (pre-trade-discipline-gate) for the month that just ended, the month the approved rules were in force. For each rule with reconsider reasons, decide keep, extend, retire, or supersede, record it in the step-6 decision log, and apply it only with `manage_approved_rules.py`. The counts are self-reported gate acknowledgements, and a withheld rate is not by itself a reason to change a rule."]},{"id":"multi-asset-opportunity-daily","name":"Multi-Asset Opportunity Daily","cadence":"daily","minutes":45,"difficulty":"intermediate","api_profile":"mixed","when_to_run":"Only after market-regime-daily has produced a non-restrictive exposure decision. Sweeps macro + themes + news to surface multi-asset ideas (equities, commodities-via-equity-proxies, options expressions) and synthesizes them into ranked hypothesis cards.","when_not_to_run":"Do not run when the latest market-regime-daily exposure_decision is cash-priority. Do not treat hypothesis cards as buy/sell signals — they carry manual_review_required and must pass human sign-off before any capital moves. Forex output is research-only; never feed it into a broker.","required_skills":["macro-regime-detector","theme-detector","trade-hypothesis-ideator","position-sizer","trader-memory-core"],"optional_skills":["market-news-analyst","market-environment-analysis","sector-analyst","scenario-analyzer","stanley-druckenmiller-investment"],"steps":[{"step":1,"name":"Refresh macro regime context","skill":"macro-regime-detector","optional":false,"decision_gate":false,"question":""},{"step":2,"name":"Detect hot themes + sector rotation","skill":"theme-detector","optional":false,"decision_gate":false,"question":""},{"step":3,"name":"Scan news + catalyst landscape","skill":"market-news-analyst","optional":true,"decision_gate":false,"question":""},{"step":4,"name":"Synthesize ranked hypothesis cards","skill":"trade-hypothesis-ideator","optional":false,"decision_gate":true,"question":"For each hypothesis, does layer 1 (macro) align with layer 2 (theme) and is what-is-priced-in still favorable? Reject any card where the gap to consensus is unclear or already closed."},{"step":5,"name":"Apply risk-based sizing to hypothesis cards","skill":"position-sizer","optional":false,"decision_gate":false,"question":""},{"step":6,"name":"Persist as IDEA / ENTRY_READY entries","skill":"trader-memory-core","optional":false,"decision_gate":true,"question":"Which hypotheses should be promoted from IDEA to ENTRY_READY, which stay as IDEA pending more confirmation, and which are rejected?"}],"manual_review":["Confirm the regime brief does not contradict the exposure_decision from market-regime-daily.","Confirm each hypothesis has a written thesis AND a kill criterion.","Confirm position sizing respects portfolio risk caps (per-position and per-sector).","For forex-related output, confirm research_only=true; never wire to a broker.","Confirm IDEA → ENTRY_READY transitions are explicit and reviewed."]},{"id":"portfolio-holdings-review","name":"Offline Holdings Review","cadence":"weekly","minutes":15,"difficulty":"beginner","api_profile":"no-api-basic","when_to_run":"Review a local USD-equity CSV or saved Alpaca positions snapshot without credentials. Supply the actual file and an aware source timestamp to portfolio-manager/scripts/review_csv.py; read the limited allocation report.","when_not_to_run":"Not for full account risk, cash/equity/leverage, performance, dividend health, trade recommendations or broker/memory reconciliation. Use the reconciled core-portfolio-weekly workflow for full brokerage analysis.","required_skills":["portfolio-manager"],"optional_skills":[],"steps":[{"step":1,"name":"Validate local holdings and review gross allocation","skill":"portfolio-manager","optional":false,"decision_gate":false,"question":""}],"manual_review":["Run review_csv.py with --input PATH --as-of TIMESTAMP --output-dir reports/UNIQUE-RUN; choose --input-format alpaca-json only for saved Alpaca data.","Confirm the input identity, source date, prices and single-account scope manually; Navigator does not inspect files.","Read JSON and Markdown limitations. Gross holdings weights are not account exposure and do not authorize trading.","Do not call broker tools, place orders, write trader-memory records, or bypass the full workflow's reconciliation gate.","Keep personal inputs and reports local; bundled replay inputs are fictional."]},{"id":"shapiro-contrarian","name":"Shapiro COT Contrarian","cadence":"weekly","minutes":60,"difficulty":"advanced","api_profile":"fmp-required","when_to_run":"Weekly, after the CFTC Commitment of Traders report publishes (Friday ~3:30pm ET, carrying Tuesday's positioning). Screens roughly 65 futures markets for crowded speculative extremes and, only where a news-failure and a weekly price-action reversal both confirm, produces a contract-sized contrarian fade plan.","when_not_to_run":"Do not run intraday or more than weekly — COT data updates once a week and the edge is positioning-driven, not intraday. Do not act on a crowding extreme alone; the gate must reach READY_FOR_PLAN (crowding, news failure, and price action all CONFIRMED) before any sizing. Not for equities — COT covers CFTC futures markets only.","required_skills":["cot-contrarian-detector","news-reaction-failure-analyzer","technical-analyst","contrarian-setup-gate","futures-position-sizer","trader-memory-core"],"optional_skills":[],"steps":[{"step":1,"name":"Screen COT crowding","skill":"cot-contrarian-detector","optional":false,"decision_gate":true,"question":"Which futures markets are at a 3-year COT-index crowding extreme (CROWDED_LONG / CROWDED_SHORT) this week? Crowding alone is not a signal — carry only the extremes forward."},{"step":2,"name":"Check for news-reaction failure","skill":"news-reaction-failure-analyzer","optional":false,"decision_gate":true,"question":"For each crowded market, did price fail to react to news favorable to the crowd's direction (CONFIRMED, against a curated primary/wire-source events file built via WebSearch)? Drop NOT_CONFIRMED / INSUFFICIENT_EVIDENCE markets."},{"step":3,"name":"Confirm weekly price-action reversal","skill":"technical-analyst","optional":false,"decision_gate":true,"question":"On the weekly chart, is there a reversal against the crowd (key reversal, failed breakout, or failed extreme) — CONFIRMED — with a defined swing stop? Reject NOT_CONFIRMED / INSUFFICIENT_DATA."},{"step":4,"name":"Synthesize the contrarian setup gate","skill":"contrarian-setup-gate","optional":false,"decision_gate":true,"question":"Does the gate reach READY_FOR_PLAN (crowding, news failure, and price action all CONFIRMED, fail-closed)? Only READY_FOR_PLAN markets proceed to sizing; CROWDED / WATCHING_PRICE / REJECTED / INSUFFICIENT_EVIDENCE stop here."},{"step":5,"name":"Size the futures position","skill":"futures-position-sizer","optional":false,"decision_gate":false,"question":""},{"step":6,"name":"Register the contrarian thesis","skill":"trader-memory-core","optional":false,"decision_gate":true,"question":"Register each fade whose sizer output is sizing_status SIZED — never a NO_TRADE result — in this order: (1) create the IDEA thesis first (manual ingest or register() — attach-futures-position only attaches to an EXISTING thesis, it never creates one); (2) attach the SIZED report with attach-futures-position, which persists contracts / direction / multiplier / USD currency / risk onto the thesis position; (3) link the upstream cot_crowding_report, news_failure_verdict, price_action_confirmation_report, and contrarian_setup_gate_report to the thesis with thesis_store.link_report() so the fade's full evidence chain is auditable; (4) only transition to ACTIVE with open-position once the order actually fills at the broker. Confirm per-trade risk matches the sizer output and total portfolio heat is within budget."}],"manual_review":["COT data is 3 days lagged (Tuesday snapshot, Friday release) — treat the crowding read as end-of-Tuesday, not live.","Crowding is a precondition, never a trade signal — require the news-failure AND price-action confirmations before sizing.","News-failure events must be curated from primary/wire sources with real URLs; do not fabricate. INSUFFICIENT_EVIDENCE never advances.","Confirm the gate setup_status is READY_FOR_PLAN before sizing; the sizer will refuse a non-READY gate, but verify the reason if it does.","Step 5 needs more than contrarian_setup_gate_report — the sizer's --entry, --account-size, and --risk-pct are always operator-supplied, even in gate-handoff mode; neither the gate nor the sizer derives them, so gather these before invoking futures-position-sizer.","Verify the sizer's contract count and per-contract risk before any order; confirm total portfolio heat is within budget.","Futures margin is broker/time-dependent and NOT computed — verify initial and maintenance margin with the broker before trading.","All orders are placed manually at the broker; no auto-execution. Monitoring (COT normalization, stop, thesis invalidation) is manual until contrarian-position-monitor ships.","The gate's entry_trigger / sizer's planned entry is not an actual fill. Keep the SIZED report itself (it carries the planned entry); a manual-ingest source also keeps entry_price in origin.raw_provenance.entry_price. Either way, never write it to entry.actual_price before a real fill happens.","Do not transition the thesis to ACTIVE (open-position) until the order actually fills at the broker. Step 6 only reaches IDEA/ENTRY_READY with the futures position attached — no order is ever placed automatically."]},{"id":"stockbee-20pct-study-daily","name":"Stockbee 20% Study Daily","cadence":"daily","minutes":30,"difficulty":"advanced","api_profile":"mixed","when_to_run":"Run after the US market close, or during historical research backfills, to identify +20%/-20% movers, classify event context, update matured outcomes, and accumulate a model book of explosive market moves.","when_not_to_run":"Do not use as a buy/sell signal workflow or automatic execution system. Do not promote new rules from small samples, current-only universes, or events without survivorship-bias and data-quality notes.","required_skills":["stockbee-20pct-study"],"optional_skills":["trader-memory-core","edge-candidate-agent","edge-hint-extractor","stockbee-episodic-pivot-analyzer","theme-detector","backtest-expert"],"steps":[{"step":1,"name":"Scan daily +20% and -20% movers","skill":"stockbee-20pct-study","optional":false,"decision_gate":false,"question":""},{"step":2,"name":"Classify catalyst, chart context, theme cluster, and risk flags","skill":"stockbee-20pct-study","optional":false,"decision_gate":false,"question":""},{"step":3,"name":"Update matured forward outcomes for prior 20% study records","skill":"stockbee-20pct-study","optional":false,"decision_gate":false,"question":""},{"step":4,"name":"Summarize cohorts and export edge hints","skill":"stockbee-20pct-study","optional":false,"decision_gate":true,"question":"Which 20% mover patterns have enough sample size, stable outcome behavior, and execution realism to promote into edge research rather than journal-only observation?"},{"step":5,"name":"Log accepted lessons","skill":"trader-memory-core","optional":true,"decision_gate":true,"question":"Which findings are accepted as operating-rule candidates, which are rejected, and which remain pending more examples?"}],"manual_review":["Inspect representative winner and failure charts before accepting any pattern.","Separate observation, research hypothesis, and executable trade plan.","Mark current-universe backfills as survivorship-biased unless delisted symbols are included.","Require explicit sample-size thresholds before promoting a cohort rule.","Feed accepted lessons into monthly-performance-review rather than changing rules ad hoc."]},{"id":"stockbee-ep-daily","name":"Stockbee EP Daily","cadence":"daily","minutes":40,"difficulty":"advanced","api_profile":"mixed","when_to_run":"Run on earnings/news-heavy days after the market-regime workflow allows new risk, or ad hoc when a game-changing catalyst appears. Use this workflow to classify Day 1 Episodic Pivot candidates and decide whether they are actionable today, delayed-EP watchlist names, or PEAD handoff candidates.","when_not_to_run":"Do not run as a blind stock screener without catalyst inputs. Do not use it to bypass market-regime gates, chart validation, position sizing, or manual catalyst review.","required_skills":["drawdown-circuit-breaker","stockbee-episodic-pivot-analyzer","technical-analyst","position-sizer","trader-memory-core","pre-trade-discipline-gate"],"optional_skills":["earnings-trade-analyzer","stockbee-momentum-burst-screener","pead-screener","theme-detector","breakout-trade-planner"],"steps":[{"step":1,"name":"Check account circuit breaker","skill":"drawdown-circuit-breaker","optional":false,"decision_gate":true,"question":"Is the account circuit breaker clear (TRADING_ALLOWED) for new EP trade risk today?"},{"step":2,"name":"Optional earnings candidate scan","skill":"earnings-trade-analyzer","optional":true,"decision_gate":false,"question":""},{"step":3,"name":"Optional momentum confirmation scan","skill":"stockbee-momentum-burst-screener","optional":true,"decision_gate":false,"question":""},{"step":4,"name":"Analyze Day 1 Episodic Pivot candidates","skill":"stockbee-episodic-pivot-analyzer","optional":false,"decision_gate":true,"question":"Which candidates have a true game-changing catalyst plus price/volume confirmation? Separate ACTIONABLE_DAY1 from DELAYED_EP_WATCH and reject low-quality headline-only moves."},{"step":5,"name":"Validate EP chart quality","skill":"technical-analyst","optional":false,"decision_gate":true,"question":"Does the chart confirm a clean EP reaction with acceptable close quality, liquidity, and risk to the EP-day low?"},{"step":6,"name":"Calculate EP position size","skill":"position-sizer","optional":false,"decision_gate":false,"question":""},{"step":7,"name":"Build optional EP trade plan","skill":"breakout-trade-planner","optional":true,"decision_gate":false,"question":""},{"step":8,"name":"Register EP thesis or watchlist entry","skill":"trader-memory-core","optional":false,"decision_gate":true,"question":"Which candidates deserve an active thesis, which belong on delayed EP / PEAD watch, and which should be ignored despite a high initial score?"},{"step":9,"name":"Run EP manual execution discipline gate","skill":"pre-trade-discipline-gate","optional":false,"decision_gate":true,"question":"Before placing any manual broker order, do ACTIONABLE_DAY1 or ENTRY_READY EP candidates pass the written-plan, predefined-stop, position-size, recent-loss, market-regime, and circuit-breaker discipline checks? Treat delayed EP, PEAD handoff, ignored, or rejected candidates as no-action journal entries, not order approvals."}],"manual_review":["Confirm market-regime-daily allows new risk before acting.","Confirm circuit_breaker_decision is TRADING_ALLOWED before analyzing new EP trade risk.","Verify the catalyst manually; this workflow does not discover or validate news truth by itself.","Treat analyst-only and story-only EPs as lower quality unless price/volume confirmation is exceptional.","Use EP-day low as the default stop reference only if the distance is realistically sizeable.","Send overextended earnings/guidance EPs to PEAD monitoring instead of chasing Day 1.","Confirm pre_trade_discipline_decision is GO before placing any manual broker order; watchlist and PEAD handoff candidates should not be treated as order approvals.","All orders are placed manually at the broker; no auto-execution."]},{"id":"stockbee-fluency-loop","name":"Stockbee Setup Fluency Loop","cadence":"daily","minutes":20,"difficulty":"intermediate","api_profile":"no-api-basic","when_to_run":"After stockbee-momentum-burst-screener produces candidate reports, and again after 3/5 trading-day windows have matured. Builds a model book of Stockbee Momentum Burst examples so the trader can improve setup recognition.","when_not_to_run":"Do not use as an execution workflow or signal service. Do not change trading rules from tiny samples; require enough matured examples and manual chart review before promoting or filtering a setup tag.","required_skills":["stockbee-setup-fluency-trainer"],"optional_skills":["trader-memory-core","signal-postmortem","backtest-expert"],"steps":[{"step":1,"name":"Ingest latest Stockbee momentum burst candidates","skill":"stockbee-setup-fluency-trainer","optional":false,"decision_gate":false,"question":""},{"step":2,"name":"Update matured 3-day and 5-day outcomes","skill":"stockbee-setup-fluency-trainer","optional":false,"decision_gate":false,"question":""},{"step":3,"name":"Summarize setup cohorts and rule candidates","skill":"stockbee-setup-fluency-trainer","optional":false,"decision_gate":true,"question":"Which setup tags have enough matured examples to promote, downgrade, or continue monitoring? Require representative chart review before changing trade rules."},{"step":4,"name":"Log accepted lessons","skill":"trader-memory-core","optional":true,"decision_gate":true,"question":"Which findings are accepted as operating-rule changes, and which remain journal-only observations pending more examples?"}],"manual_review":["Inspect representative winner and failure charts before accepting a rule change.","Separate evidence from execution decisions; this workflow records setup behavior, not actual P&L.","Keep sample-size thresholds explicit, especially when market regime changes.","Feed accepted lessons into monthly-performance-review rather than adding ad-hoc rules daily."]},{"id":"strategy-research-pipeline","name":"Strategy Research Pipeline","cadence":"ad-hoc","minutes":60,"difficulty":"advanced","api_profile":"no-api-basic","when_to_run":"During offline research with a dated local EOD OHLCV parquet file. Detect research tickets, extract hints, and repeat detection against the same file and as-of date. Evaluate a final ticket only after a separate backtest has produced traceable metrics for that exact strategy and data period.","when_not_to_run":"Do not use undated or unverified historical data, missing backtest metrics, or metrics from another ticket. This workflow does not execute a backtest, export to an external pipeline, authorize a strategy, or place trades.","required_skills":["edge-candidate-agent","edge-hint-extractor","backtest-expert"],"optional_skills":[],"steps":[{"step":1,"name":"Detect initial candidates from local OHLCV","skill":"edge-candidate-agent","optional":false,"decision_gate":false,"question":""},{"step":2,"name":"Extract dated deterministic edge hints","skill":"edge-hint-extractor","optional":false,"decision_gate":false,"question":""},{"step":3,"name":"Redetect final tickets with the same OHLCV and as-of date","skill":"edge-candidate-agent","optional":false,"decision_gate":true,"question":"Was the same local OHLCV file and --as-of date used as in step 1, with --hints pointing to step 2's hints.yaml and a separate output directory? Is there a final ticket worth testing? If not, stop here."},{"step":4,"name":"Evaluate separately measured backtest results","skill":"backtest-expert","optional":false,"decision_gate":true,"question":"Before invoking the evaluator, can the operator match all supplied metrics to this final ticket's strategy, universe, time period, and cost assumptions? Are all required metrics present, with slippage actually tested? If any answer is no or unknown, HOLD without a verdict. A Deploy/Refine/Abandon score is never approval to trade real funds."}],"manual_review":["Use the same local --ohlcv parquet and --as-of date for both candidate runs; pass that --as-of date to edge-hint-extractor too, and verify hints.yaml records it. Write to separate directories and pass step 2 hints.yaml with --hints on the second run. Do not pass --export-strategies-dir or --pipeline-root.","Preserve the final ticket ID, universe, data period, cost assumptions, and provenance of the separate backtest metrics together with the result.","Supply total-trades, win-rate, avg-win-pct, avg-loss-pct, max-drawdown-pct, years-tested, and num-parameters to backtest-expert; use --slippage-tested only when friction was actually modeled. Missing or unlinked metrics mean HOLD before evaluation.","Independently inspect look-ahead, survivorship, and out-of-sample evidence; the scoring CLI does not verify these. Unknown means HOLD.","Keep research tickets and evaluation local. No external pipeline export, live API write, broker order, or real-money decision follows automatically."]},{"id":"swing-opportunity-daily","name":"Swing Opportunity Daily","cadence":"daily","minutes":40,"difficulty":"intermediate","api_profile":"fmp-required","when_to_run":"Only after market-regime-daily has produced a non-restrictive exposure decision. Identifies swing trade candidates and builds entry plans.","when_not_to_run":"Do not run when the latest market-regime-daily exposure_decision is cash-priority or restrictive. Do not use as a standalone screener without the regime gate.","required_skills":["vcp-screener","drawdown-circuit-breaker","technical-analyst","position-sizer","trader-memory-core","pre-trade-discipline-gate"],"optional_skills":["stockbee-momentum-burst-screener","stockbee-exhaustion-hammer-screener","canslim-screener","breakout-trade-planner","theme-detector"],"steps":[{"step":1,"name":"Check account circuit breaker","skill":"drawdown-circuit-breaker","optional":false,"decision_gate":true,"question":"Is the account circuit breaker clear (TRADING_ALLOWED) for new trade risk today?"},{"step":2,"name":"Run VCP screener","skill":"vcp-screener","optional":false,"decision_gate":false,"question":""},{"step":3,"name":"Run Stockbee momentum burst screener","skill":"stockbee-momentum-burst-screener","optional":true,"decision_gate":false,"question":""},{"step":4,"name":"Run Stockbee exhaustion hammer screener","skill":"stockbee-exhaustion-hammer-screener","optional":true,"decision_gate":false,"question":""},{"step":5,"name":"Run CANSLIM screener","skill":"canslim-screener","optional":true,"decision_gate":false,"question":""},{"step":6,"name":"Theme detection cross-check","skill":"theme-detector","optional":true,"decision_gate":false,"question":""},{"step":7,"name":"Validate setups on weekly chart","skill":"technical-analyst","optional":false,"decision_gate":true,"question":"Which candidates have a clean weekly setup (Stage 2 uptrend, tight base, or Stockbee-style range expansion from a controlled base) and pass the manual chart review? For exhaustion hammers, confirm the pullback is not thesis-breaking and risk to the day low is acceptable. Reject candidates that don't pass."},{"step":8,"name":"Calculate position size","skill":"position-sizer","optional":false,"decision_gate":false,"question":""},{"step":9,"name":"Build entry plan","skill":"breakout-trade-planner","optional":true,"decision_gate":false,"question":""},{"step":10,"name":"Register thesis in journal","skill":"trader-memory-core","optional":false,"decision_gate":true,"question":"For each candidate that survived validation, register the thesis with entry / stop / target. Confirm risk per trade matches position-sizer output and total portfolio heat is within budget."},{"step":11,"name":"Run manual execution discipline gate","skill":"pre-trade-discipline-gate","optional":false,"decision_gate":true,"question":"Before placing any manual broker order, does each actionable candidate pass the written-plan, predefined-stop, position-size, recent-loss, market-regime, and circuit-breaker discipline checks?"}],"manual_review":["Confirm market-regime-daily exposure_decision allows new risk before acting.","Confirm circuit_breaker_decision is TRADING_ALLOWED before screening or sizing new candidates.","Reject any candidate where weekly setup is unclear, even if screener passed.","Treat Stockbee momentum burst output as candidate generation only; require chart validation and risk-distance review.","Treat Stockbee exhaustion hammer output as candidate generation only; confirm the pullback is not caused by a thesis-breaking news event and verify risk to the day low.","Verify total portfolio heat is within budget before placing any order.","Confirm pre_trade_discipline_decision is GO before placing any manual broker order.","All orders are placed manually at the broker; no auto-execution."]},{"id":"trade-memory-loop","name":"Trade Memory Loop","cadence":"ad-hoc","minutes":30,"difficulty":"beginner","api_profile":"no-api-basic","when_to_run":"Every time a position is closed (full or partial exit). Records the outcome, generates a postmortem, (optionally) coaches process / risk / execution / behavior patterns, and (optionally) re-validates the original hypothesis via backtest.","when_not_to_run":"Do not run before a position is closed — use trader-memory-core directly to update an open thesis instead. Do not skip this loop after a closed trade, even on winners.","required_skills":["trader-memory-core","signal-postmortem"],"optional_skills":["trade-performance-coach","backtest-expert"],"steps":[{"step":1,"name":"Record closed trade outcome","skill":"trader-memory-core","optional":false,"decision_gate":false,"question":""},{"step":2,"name":"Generate postmortem","skill":"signal-postmortem","optional":false,"decision_gate":true,"question":"What was the root cause of the outcome — thesis quality, execution, market environment, or randomness? Classify and document."},{"step":3,"name":"Coach process, risk, and behavior patterns","skill":"trade-performance-coach","optional":true,"decision_gate":true,"question":"Which next-session operating rules should the trader accept, modify, defer, or journal only?"},{"step":4,"name":"Re-validate hypothesis via backtest","skill":"backtest-expert","optional":true,"decision_gate":false,"question":""},{"step":5,"name":"Append lessons to journal","skill":"trader-memory-core","optional":false,"decision_gate":false,"question":""}],"manual_review":["Be honest about whether the win was thesis-driven or lucky.","Be honest about whether the loss was thesis-flawed or executed poorly.","Don't rationalize randomness as either skill or failure."]}],"skillsets":[{"id":"core-portfolio","name":"Core Portfolio","difficulty":"beginner","api_profile":"mixed","when_to_use":"The long-term core sleeve: review holdings, dividend health, and overall allocation once a week. Use to keep the buy-and-hold / dividend book healthy and decide deliberate rebalance actions. Operationalized weekly by the core-portfolio-weekly workflow.","required":["portfolio-manager","trader-memory-core"],"recommended":["kanchi-dividend-review-monitor","value-dividend-screener","kanchi-dividend-us-tax-accounting"],"optional":["dividend-growth-pullback-screener","kanchi-dividend-sop"]},{"id":"dividend-income","name":"Dividend Income","difficulty":"intermediate","api_profile":"mixed","when_to_use":"Source and underwrite new US-listed dividend candidates once a week with Kanchi's 5-step method: screen for yield and quality, deep-dive the strongest names, and register a fully documented candidate thesis before any entry. Operationalized by the kanchi-dividend-weekly workflow (v1 covers US-listed dividend stocks only).","required":["kanchi-dividend-sop","trader-memory-core"],"recommended":["value-dividend-screener","dividend-growth-pullback-screener"],"optional":["kanchi-dividend-us-tax-accounting","kanchi-dividend-review-monitor"]},{"id":"market-regime","name":"Market Regime","difficulty":"beginner","api_profile":"mixed","when_to_use":"The shared risk layer for every trading day. Use before considering new swing-trade risk to decide today's exposure posture (allow / restrict / cash-priority) from breadth, uptrend participation, and top-risk signals. Operationalized daily by the market-regime-daily workflow.","required":["market-breadth-analyzer","uptrend-analyzer","exposure-coach"],"recommended":["market-top-detector","macro-regime-detector"],"optional":["breadth-chart-analyst","sector-analyst","market-environment-analysis","market-news-analyst","downtrend-duration-analyzer","us-market-bubble-detector"]},{"id":"strategy-research","name":"Strategy Research","difficulty":"advanced","api_profile":"no-api-basic","when_to_use":"Research a long-side US equity idea from local historical observations: detect candidate tickets, refine them with hints, and evaluate separately measured backtest results. The strategy-research-pipeline workflow is an offline research path, not an end-to-end backtest runner.","required":["edge-candidate-agent","edge-hint-extractor","backtest-expert"],"recommended":[],"optional":["strategy-pivot-designer"]},{"id":"swing-opportunity","name":"Swing Opportunity","difficulty":"intermediate","api_profile":"fmp-required","when_to_use":"The satellite swing sleeve: generate and validate swing-trade candidates and build risk-sized entry plans. Use only on days the market-regime sleeve has allowed new risk. Operationalized by the swing-opportunity-daily workflow (prerequisite: market-regime-daily exposure decision).","required":["vcp-screener","drawdown-circuit-breaker","technical-analyst","position-sizer","trader-memory-core","pre-trade-discipline-gate"],"recommended":["canslim-screener","breakout-trade-planner","theme-detector"],"optional":["stockbee-momentum-burst-screener","stockbee-exhaustion-hammer-screener","finviz-screener"]},{"id":"trade-memory","name":"Trade Memory","difficulty":"beginner","api_profile":"no-api-basic","when_to_use":"The shared learning loop: record closed-trade outcomes, run postmortems, and feed lessons back into the process. Use after every closed position and for the monthly performance retrospective. Operationalized by the trade-memory-loop (per closed trade) and monthly-performance-review (monthly) workflows.","required":["trader-memory-core","signal-postmortem"],"recommended":["backtest-expert","trade-performance-coach"],"optional":["trade-hypothesis-ideator"]}],"zh":{"skills":{"backtest-expert":{"title":"回測專家","summary":"以系統化回測、參數敏感度、交易摩擦與樣本外驗證評估策略穩健性。","when_to_use":"開發或驗證量化策略、排查回測偏誤，或評估滑價與不同市場環境的影響時。","how_to_start":"提供明確交易規則、歷史資料與績效指標；評估腳本需 Python 3.9+，免 API 金鑰。","cautions":"避免過度擬合、前視及倖存者偏誤；高分不能覆蓋樣本不足、負期望值或缺乏摩擦驗證等阻擋條件。"},"breadth-chart-analyst":{"title":"市場廣度圖表分析","summary":"結合 S&P 500 廣度指數及美股上升趨勢比例，評估中期環境與短期時機。","when_to_use":"想了解市場參與程度、整體健康度，或分析相關廣度圖表時。","how_to_start":"取得公開 GitHub Pages CSV；可附圖表補充，免 API 金鑰。","cautions":"CSV 是主要依據，圖表僅供補充；原技能分析與報告使用英文。"},"breakout-trade-planner":{"title":"突破交易規劃器","summary":"依 VCP 候選產生突破計畫，計算最壞情境風險、部位及投資組合風險，提供 Alpaca 訂單範本。","when_to_use":"已有 VCP 篩選結果，需要突破進場、停損、目標或部位規劃時。","how_to_start":"提供 schema_version 為 1.0 的 VCP JSON 與帳戶規模；本機計算免 API 金鑰。","cautions":"訂單範本不代表成交；須考量最壞情境風險及整體部位風險。"},"canslim-screener":{"title":"CANSLIM 篩選器","summary":"依 William O'Neil 的 CANSLIM 方法，篩選基本面與動能兼具的美股成長股。","when_to_use":"尋找獲利加速、接近 52 週高點或具成長動能的股票時。","how_to_start":"設定 FMP_API_KEY，提供篩選範圍；使用 Python 3.9+ 及指定套件。","cautions":"免費 FMP 額度約可分析 35 檔；較大範圍需要相應付費方案。"},"contrarian-setup-gate":{"title":"逆勢交易確認閘門","summary":"整合 COT 擁擠、消息反應失敗及週線價格確認，以狀態機判定逆勢條件。","when_to_use":"完成 COT 篩選後，檢查後續證據是否足以進入部位規劃時。","how_to_start":"提供同一標的 COT JSON，可追加消息反應與價格確認報告；免 API 金鑰。","cautions":"過期、缺漏、格式錯誤或標的不符的資料不得通過；READY_FOR_PLAN 不代表下單訊號。"},"cot-contrarian-detector":{"title":"COT 逆勢擁擠偵測","summary":"依 CFTC COT 報告辨識期貨市場大型投機者的極端擁擠部位。","when_to_use":"尋找逆勢期貨研究對象、查看投機者持倉偏向或擁擠市場時。","how_to_start":"設定 FMP_API_KEY；COT 端點需 Premium+ 方案，選擇市場或核心清單。","cautions":"COT 資料落後約 3–9 天；擁擠只是前提，仍需消息反應與價格確認。"},"crypto-regime-analyzer":{"title":"加密市場環境分析","summary":"以六項成分合成 0–100 分，量化加密市場風險偏好與健康程度。","when_to_use":"檢查加密市場風險偏好、BTC 市占、山寨幣環境或資金費率時。","how_to_start":"使用 CoinGecko 與 Binance 公開資料，或提供離線 JSON；免 API 金鑰。","cautions":"市占歷史需累積 31 筆日資料；資金費率可能因地區或服務限制而缺漏。"},"data-quality-checker":{"title":"資料品質檢查器","summary":"在發布市場分析或文章前，檢查金融資料與文件內容的一致性。","when_to_use":"發布週報、自動市場摘要、翻譯文件或整合多來源金融資料前。","how_to_start":"提供 Markdown 文件，使用 Python 3.9+ 標準函式庫；免 API 金鑰。","cautions":"檢查範圍限於文件資料品質。"},"dividend-growth-pullback-screener":{"title":"股息成長拉回篩選器","summary":"篩選年股息成長率至少 12%、殖利率至少 1.5% 且 RSI 不高於 40 的股票。","when_to_use":"尋找股息高成長、短期拉回且著重長期總報酬的標的時。","how_to_start":"設定 FMP_API_KEY；可搭配 FINVIZ，或使用含股票篩選端點的 FMP 方案。","cautions":"不適合追求高當期股息收入者；FMP 免費方案不含股票篩選端點。"},"downtrend-duration-analyzer":{"title":"下跌期間分析器","summary":"統計歷史下跌期間，依產業及市值產生互動式 HTML 分布圖。","when_to_use":"研究修正與復原所需時間、比較產業或制定持有期間限制時。","how_to_start":"設定 FMP_API_KEY，提供篩選範圍及歷史日期；需 requests、pandas、numpy。","cautions":"僅支援指定 stable 端點，無舊版 v3 備援；空白或異常歷史資料須留意。"},"drawdown-circuit-breaker":{"title":"帳戶回撤熔斷器","summary":"讀取交易紀錄，依每日虧損、連敗冷卻與週月回撤限制判定是否允許新增風險。","when_to_use":"篩選或計算新部位前、虧損後或每日檢查風險限制時。","how_to_start":"提供 trader-memory-core 的本機 thesis YAML 與美元帳戶規模；免 API 金鑰。","cautions":"判定的是新增交易風險是否允許，而非標的買賣訊號。"},"dual-axis-skill-reviewer":{"title":"雙軸技能審查器","summary":"結合可重現的程式檢查與 LLM 深度審查，評估技能結構、測試及執行安全。","when_to_use":"需要技能評分、改善建議或跨專案審查時。","how_to_start":"提供技能原始碼；使用 Python 3.9+，建議 uv；合併 LLM 結果需符合指定 JSON 結構。","cautions":"程式檢查與 LLM 審查是不同證據來源，不應混為一談。"},"earnings-calendar":{"title":"財報行事曆","summary":"透過 FMP 取得美股即將公布的財報日期。","when_to_use":"查詢近期財報公告或依日期、市值篩選財報事件時。","how_to_start":"設定 FMP_API_KEY，指定日期範圍與市值條件。","cautions":"結果依賴 FMP 財報行事曆資料。"},"earnings-trade-analyzer":{"title":"財報交易分析器","summary":"以跳空幅度、財報前趨勢、成交量趨勢及 MA200、MA50 位置評分財報後股票。","when_to_use":"篩選近期財報跳空、評估財報反應或尋找 PEAD 候選時。","how_to_start":"設定 FMP_API_KEY，指定回顧天數與候選數。","cautions":"免費額度適用預設兩天、前 20 檔；擴大範圍可能需要付費方案。"},"economic-calendar-fetcher":{"title":"經濟行事曆擷取器","summary":"透過 FMP 取得即將發布的經濟數據與重要事件。","when_to_use":"查詢 FOMC、CPI、就業、GDP 公布時間或規劃事件風險時。","how_to_start":"設定 FMP_API_KEY，指定日期範圍；需 Python 3.10+。","cautions":"資料取決於 FMP 行事曆及 API 額度。"},"fxmacrodata-calendar":{"title":"FXMacroData 行事曆","summary":"取得官方來源的總體經濟公布行事曆，供事件風險規劃。","when_to_use":"CPI、NFP、GDP、PCE、PMI 或央行決策公布前。","how_to_start":"指定幣別與事件等級；公開 USD 資料免金鑰，驗證端點可設定 FXMACRODATA_API_KEY。","cautions":"公開免金鑰範圍限於 USD 行事曆資料。"},"edge-candidate-agent":{"title":"交易優勢候選代理","summary":"將美股多方市場觀察轉為研究工單，排序並匯出符合策略研究管線介面的候選。","when_to_use":"從收盤資料或異常觀察發掘優勢假說，或準備管線第一階段輸入時。","how_to_start":"提供 EOD OHLCV 或研究工單；需 Python、PyYAML，驗證時需目標管線專案。","cautions":"不合風險、出場及條件結構的候選會被拒絕；完整執行前先 dry-run。"},"edge-concept-synthesizer":{"title":"交易優勢概念整合器","summary":"將原始工單與提示抽象為具論點、失效訊號與策略手冊的可重用概念。","when_to_use":"大量工單需要依機制整理，或希望在策略草擬前降低過度擬合時。","how_to_start":"提供 tickets YAML 目錄，可附 hints.yaml；需 Python 與 PyYAML。","cautions":"概念是研究中介產物，不是已驗證策略。"},"edge-hint-extractor":{"title":"交易優勢提示擷取器","summary":"從每日市場觀察、異常與消息反應擷取結構化提示，可加入受證據約束的 LLM 發想。","when_to_use":"需要 hints.yaml 供概念整合或自動候選偵測時。","how_to_start":"準備 market_summary.json、anomalies.json 或消息反應資料；需 Python 與 PyYAML。","cautions":"LLM 發想須受當前異常與消息脈絡約束。"},"edge-pipeline-orchestrator":{"title":"交易優勢管線協調器","summary":"協調候選偵測、概念整理、策略設計、審查、修訂與匯出。","when_to_use":"執行完整研究流程、接續未完成草稿或預覽匯出結果時。","how_to_start":"提供工單或 OHLCV 資料，安裝所有相依技能及 PyYAML；免 API 金鑰。","cautions":"單獨安裝協調器不足以執行；可先 dry-run，不直接匯出。"},"edge-signal-aggregator":{"title":"交易優勢訊號整合器","summary":"彙整多項優勢研究技能的輸出，加權評分、去重並標示矛盾訊號。","when_to_use":"整合主題、產業、機構資金與候選研究結果，決定深入研究優先順序時。","how_to_start":"提供各上游技能的本機 JSON 或 YAML；免 API 金鑰。","cautions":"加權排序用於整合研究證據，不能忽略不同來源之間的矛盾。"},"edge-strategy-designer":{"title":"交易優勢策略設計器","summary":"將抽象優勢概念轉為核心、保守及研究探索等策略草稿。","when_to_use":"已有概念 YAML，需設計多種策略變體或匯出研究工單時。","how_to_start":"提供 edge_concepts.yaml；需 Python 3.9+ 與 PyYAML。","cautions":"輸出仍為策略草稿，須經後續審查。"},"edge-strategy-reviewer":{"title":"交易優勢策略審查器","summary":"審查草稿的優勢合理性、過度擬合風險、樣本充足度及執行可行性。","when_to_use":"策略設計完成後、匯出至候選代理前，或手動驗證草稿時。","how_to_start":"提供 strategy_drafts YAML；需 Python 3.10+ 與 PyYAML。","cautions":"草稿審查著重合理性及風險，不能取代實際策略驗證。"},"exposure-coach":{"title":"曝險教練","summary":"整合廣度、趨勢、風險及資金流訊號，產出曝險上限與市場配置摘要。","when_to_use":"每週開始、新增股票部位前、訊號衝突或市場環境轉變時。","how_to_start":"提供上游市場分析 JSON；機構資金流資料需 FMP_API_KEY。","cautions":"依上游訊號整合市場姿態，不是個股交易訊號。"},"finviz-screener":{"title":"FINVIZ 篩選器","summary":"將自然語言股票條件轉為 FINVIZ 篩選網址並開啟瀏覽器。","when_to_use":"想依基本面、技術面、市值、產業或內部人交易條件篩選股票時。","how_to_start":"輸入自然語言條件；公開版免金鑰，可選 FINVIZ Elite，或用 --url-only。","cautions":"用於建立篩選條件，不是深入個股基本面分析。"},"ftd-detector":{"title":"FTD 底部確認偵測器","summary":"依 O'Neil 方法追蹤 S&P 500 與 NASDAQ 的反彈嘗試、FTD 及後續健康度。","when_to_use":"市場修正後評估反彈是否持續，或查詢底部確認與恢復曝險的條件時。","how_to_start":"設定 FMP_API_KEY，使用 Python 3.9+ 與 requests 取得指數資料。","cautions":"端點權限依 FMP 方案而異；重試會增加 API 呼叫次數。"},"futures-position-sizer":{"title":"期貨部位計算器","summary":"依方向、進場、停損與合約乘數、跳動單位計算風險限制內的期貨口數。","when_to_use":"已知期貨進場與停損，或逆勢閘門達 READY_FOR_PLAN 時。","how_to_start":"提供標的、方向、進場、停損、帳戶規模及風險比例；免 API 金鑰。","cautions":"沒有明確停損不得計算；口數一律無條件捨去，表外合約須提供完整規格。"},"ibd-distribution-day-monitor":{"title":"IBD 出貨日監控","summary":"辨識 QQQ、SPY 放量下跌的出貨日，追蹤有效期限、群聚及市場風險等級。","when_to_use":"美股收盤後、調整 TQQQ 曝險前，或作為 FTD 與市場狀態分析輸入時。","how_to_start":"設定 FMP_API_KEY，取得 QQQ、SPY OHLCV；可指定回顧期與日期。","cautions":"不執行交易或修改訂單，也不產生超出 IBD 規則的主觀預測。"},"institutional-flow-tracker":{"title":"機構資金流追蹤器","summary":"以 13F 申報資料追蹤機構持股變化、累積與減碼。","when_to_use":"驗證投資論點、追蹤特定基金或觀察產業輪動與持股風險時。","how_to_start":"設定 FMP_API_KEY，指定基金或持股範圍；需 Python 3.9+ 與 requests。","cautions":"13F 最多延遲 45 天，僅為季末申報快照，不含空方等完整曝險，非即時訊號。"},"kanchi-dividend-review-monitor":{"title":"Kanchi 股息風險監控","summary":"依 T1–T5 強制複查條件，將股息持倉異常分類為 OK、WARN 或 REVIEW。","when_to_use":"每日、每週或每季監控減配、8-K 治理風險與股息安全時。","how_to_start":"提供符合結構的持倉 JSON，至少含 ticker、工具類型及最近兩次常態股息。","cautions":"只建立人工複查佇列，不自動賣出；上游資料不足時需提供最低必要欄位。"},"kanchi-dividend-sop":{"title":"Kanchi 股息投資流程","summary":"將 Kanchi 股息方法轉為美股篩選、深入研究、拉回規劃與持續監控流程。","when_to_use":"需要可重複的股息股篩選、品質檢查、估值及一頁研究備忘錄時。","how_to_start":"提供股票範圍及產業條件；進場訊號腳本需 FMP_API_KEY。","cautions":"研究備忘錄須明列失效條件，並銜接後續監控與稅務流程。"},"kanchi-dividend-us-tax-accounting":{"title":"Kanchi 美股股息稅務","summary":"整理美國股息稅務分類、持有期間及應稅帳戶與 IRA 配置流程。","when_to_use":"理解 1099-DIV、合格股息、REIT 或 BDC 配息與年度稅務整理時。","how_to_start":"提供 ticker、工具及帳戶類型、持有天數與配息資料，依 JSON 結構輸入。","cautions":"分類依輸入及持有期間判定，須區分一般股票與不同收益工具。"},"macro-regime-detector":{"title":"總體環境轉換偵測","summary":"以跨資產比率、殖利率曲線、信用與產業輪動辨識一至兩年結構性環境。","when_to_use":"評估市場集中或擴散、總體環境轉換與長期配置脈絡時。","how_to_start":"安裝 yfinance、requests；可選 FMP_API_KEY 取得優先資料來源。","cautions":"免費 FMP 可能缺少部分 ETF，會改用 yfinance 等備援；著重長期結構而非短線。"},"manifoldbt-backtester":{"title":"ManifoldBT 回測器","summary":"以 manifoldbt 引擎執行宣告式策略，將成交紀錄整理為回測評估所需指標。","when_to_use":"需要由真實 OHLCV 測量勝率、平均盈虧或最大回撤時。","how_to_start":"提供策略規格及含 timestamp、OHLCV 欄位的 CSV 或 Parquet；安裝 manifoldbt。","cautions":"此技能僅支援指定指標、單一進場條件及多方策略；評估結論由 backtest-expert 負責。"},"market-breadth-analyzer":{"title":"市場廣度分析器","summary":"利用 TraderMonty 公開 CSV，以六項成分量化市場廣度健康度，產出 0–100 分。","when_to_use":"評估上漲是否廣泛、參與率、漲跌家數或市場廣度轉弱時。","how_to_start":"取得公開 GitHub Pages CSV；需 Python 3.9+ 與 requests，免 API 金鑰。","cautions":"分數依公開 CSV 的涵蓋期間及更新狀況計算。"},"market-environment-analysis":{"title":"全球市場環境分析","summary":"分析美歐亞股市、外匯、商品及經濟指標，整理風險偏好、產業與技術面。","when_to_use":"需要每日或每週市場簡報、跨市場關聯或整體風險環境評估時。","how_to_start":"提供分析需求，使用 WebSearch 取得市場資料；可補充圖表及經濟行事曆。","cautions":"即時市場資料依賴網路搜尋；經濟行事曆為選用輸入。"},"market-news-analyst":{"title":"市場新聞分析器","summary":"蒐集近十天重要新聞，按價格影響、廣度及未來重要性排序並分析市場反應。","when_to_use":"查詢央行決策、地緣政治、巨型股財報或商品與股市新聞影響時。","how_to_start":"使用 WebSearch、WebFetch 蒐集可信新聞；免 API 金鑰。","cautions":"以近十天美股及商品為主；原技能分析與 Markdown 報告使用英文。"},"market-top-detector":{"title":"市場頂部風險偵測器","summary":"結合出貨日、領先股惡化及防禦產業輪動，評估 0–100 分頂部風險。","when_to_use":"出貨日增加、領先股轉弱，或評估未來二至八週修正風險時。","how_to_start":"設定 FMP_API_KEY；使用 WebSearch 補充市場廣度與 Put/Call 比率。","cautions":"屬啟發式戰術風險評分；融資餘額等資料可能落後一至兩個月。"},"mt5-robot-tester":{"title":"MT5 交易機器人測試器","summary":"以三輪可續跑的本機流程批次測試 MT5 EA，排序結果並保留參數及商品研究紀錄。","when_to_use":"評估多個 EA、比較交易商品、最佳化參數或接續中斷測試時。","how_to_start":"準備 Windows、MetaTrader 5、EA 檔案、經紀商 tick 資料與商品設定。","cautions":"預設使用真實 tick 模型，測試品質依賴經紀商資料及設定。"},"news-reaction-failure-analyzer":{"title":"消息反應失敗分析器","summary":"檢驗擁擠投機部位是否未對有利消息產生預期反應，並進行漂移顯著性檢驗。","when_to_use":"COT 已標示擁擠多方或空方，需進一步確認逆勢條件時。","how_to_start":"設定 FMP_API_KEY，準備事件 JSON 與 COT 報告；利用 WebSearch 整理事件。","cautions":"CONFIRMED 僅代表第二步確認；可用事件群聚不足、資料過期或缺漏不得推進。"},"options-strategy-advisor":{"title":"選擇權策略顧問","summary":"分析選擇權策略、模擬損益與 Greeks，協助比較策略的風險結構。","when_to_use":"了解 covered call、iron condor、價差策略、損益上限或 Greeks 曝險時。","how_to_start":"提供標的價格、波動率及策略參數；可選 FMP 金鑰取得資料，需 numpy、scipy、requests。","cautions":"無 API 時須自行輸入股價及波動率；模擬結果依賴輸入參數。"},"pair-trade-screener":{"title":"配對交易篩選器","summary":"利用共整合及均值回歸等統計方法，尋找可能的配對交易研究對象。","when_to_use":"研究市場中性策略、產業避險、相對價值或股票配對時。","how_to_start":"設定具股票篩選及歷史價格權限的 FMP_API_KEY；準備範圍及回顧期，需 statsmodels。","cautions":"統計篩選結果是配對研究依據，而非直接交易指令。"},"parabolic-short-trade-planner":{"title":"拋物線放空規劃器","summary":"篩選急漲衰竭型態，產生有條件的盤前放空計畫，並檢查五分鐘觸發條件。","when_to_use":"建立放空觀察名單、評估借券、SSR 與盤前風險限制時。","how_to_start":"設定 FMP_API_KEY；可選 Alpaca 金鑰取得即時借券及五分鐘資料。","cautions":"無 Alpaca 時需人工確認並標記 watch_only；不適用一分鐘以下盤中訊號或多方篩選。"},"pead-screener":{"title":"PEAD 財報漂移篩選器","summary":"篩選財報跳空上漲後的延續型態與週線動能。","when_to_use":"研究財報後漂移、下跌 K 棒突破型態，或深入分析財報交易候選時。","how_to_start":"準備 earnings-trade-analyzer JSON 或財報候選清單及週線 OHLCV；設定 FMP_API_KEY。","cautions":"聚焦財報後延續型態，並非所有財報跳空股票。"},"portfolio-manager":{"title":"投資組合管理器","summary":"分析持倉配置、風險、個股部位與分散程度，整理再平衡分析。","when_to_use":"檢視目前持股、組合風險、資產分配或績效時。","how_to_start":"使用 Alpaca MCP 取得持倉，或提供本機持倉快照。","cautions":"資料準確性依賴 Alpaca 及第三方來源；分析僅供資訊參考，過往績效不保證未來結果。"},"position-sizer":{"title":"股票部位計算器","summary":"依帳戶規模、進場、停損及風險預算計算多方股票部位。","when_to_use":"需要計算股數、單筆風險、ATR 部位或檢查集中度限制時。","how_to_start":"提供進場價、停損價、帳戶規模及風險參數；免 API 金鑰。","cautions":"適用多方股票部位；計算依賴明確停損與風險輸入。"},"pre-trade-discipline-gate":{"title":"交易前紀律閘門","summary":"透過離線檢查清單阻擋無計畫、過大部位、報復性交易或不符合風險限制的進場。","when_to_use":"人工下單前、近期虧損後，或候選已通過圖表與部位驗證時。","how_to_start":"提供候選檢查清單 JSON 或 YAML；可附曝險、熔斷判定與 thesis 紀錄。","cautions":"只做交易前檢查及記錄，不執行訂單。"},"residual-edge-analyzer":{"title":"殘差交易優勢分析器","summary":"用 HAC 迴歸、滾動穩定性、基準敏感度及環境診斷，拆解策略曝險與殘差優勢。","when_to_use":"需要判斷策略報酬是否主要來自既有基準曝險時。","how_to_start":"準備同日對齊的策略及基準報酬 CSV，並提供符合契約的 JSON 規格。","cautions":"必須使用實際期間報酬，不可用其他績效摘要替代。"},"scenario-analyzer":{"title":"情境分析器","summary":"從新聞建立十八個月多種情境，整理一至三階影響，並以另一代理提供第二意見。","when_to_use":"評估新聞中長期影響、產業連鎖效應或需要第二意見時。","how_to_start":"提供新聞標題；需 WebSearch、WebFetch 及 scenario-analyst、strategy-reviewer 代理。","cautions":"情境是條件式分析，不等同已發生的市場結果。"},"sector-analyst":{"title":"產業輪動分析器","summary":"利用公開 CSV 分析產業輪動、景氣循環與週期性或防禦性配置脈絡。","when_to_use":"研究強弱產業、超買超賣、景氣階段或產業篩選時。","how_to_start":"取得公開 GitHub CSV，可附產業圖表；需 Python 3.9+，免金鑰。","cautions":"圖表僅補充；避免確認偏誤，原技能分析及 Markdown 報告使用英文。"},"signal-postmortem":{"title":"訊號事後檢討","summary":"記錄交易或訊號到期結果，辨識誤判模式並回饋訊號權重與改善清單。","when_to_use":"交易結束、五日或二十日訊號到期，或檢視技能假陽性時。","how_to_start":"提供訊號紀錄 JSON；可手動輸入實際報酬，或選用 FMP 金鑰取得資料。","cautions":"需以實際結果檢討，不應將未到期訊號當作已結案。"},"skill-designer":{"title":"技能設計器","summary":"將結構化構想規格轉為新 Claude 技能設計提示，支援自動產生流程。","when_to_use":"從待辦構想建立新技能，或依品質評分規準審查生成結果時。","how_to_start":"提供構想 JSON，確認 references/ 下的參考檔案存在；免 API 金鑰。","cautions":"設計提示不是已完成或已驗證的技能。"},"skill-idea-miner":{"title":"技能構想探勘器","summary":"從 Claude Code 工作階段日誌擷取可重用技能構想，更新候選待辦。","when_to_use":"每週自動流程、手動更新構想清單或 dry-run 預覽時。","how_to_start":"準備 Claude CLI、已登入環境、工作階段日誌及 Python 3.10+、PyYAML。","cautions":"dry-run 只預覽候選，不執行 LLM 評分。"},"skill-integration-tester":{"title":"技能整合測試器","summary":"檢查 CLAUDE.md 定義的多技能流程、JSON 契約、檔名及交接完整性。","when_to_use":"修改工作流程、輸出格式、發布新技能或排查交接問題時。","how_to_start":"提供 CLAUDE.md 與技能輸出，使用 Python 3.9+ 標準函式庫。","cautions":"檢查著重技能間契約及交接相容性。"},"stanley-druckenmiller-investment":{"title":"Druckenmiller 策略整合","summary":"整合市場廣度、趨勢、頂部風險、總體環境等上游訊號，形成 0–100 信念評分。","when_to_use":"需要整體市場姿態、統一解讀相互衝突的市場訊號時。","how_to_start":"提供 reports/ 下五項必要上游 JSON，可加入其他技能報告；本技能免金鑰。","cautions":"必要報告須存在且在 72 小時內；上游技能可能各自需要金鑰。"},"stockbee-20pct-study":{"title":"Stockbee 20% 漲跌研究","summary":"建立每日漲跌 20% 事件研究，分類催化因素並追蹤後續結果，輸出研究提示。","when_to_use":"研究大幅漲跌股票、歷史延續或反轉，以及主題群聚時。","how_to_start":"使用 FMP 或離線 OHLCV JSON；可補充新聞、環境報告與本機研究資料庫。","cautions":"大幅漲跌事件僅供研究，不是買賣訊號。"},"stockbee-episodic-pivot-analyzer":{"title":"Stockbee EP 分析器","summary":"依催化事件品質、跳空、量能、重估脈絡與風險評估首日 Episodic Pivot 候選。","when_to_use":"研究財報、財測、併購、FDA、合約或主題消息驅動的 EP 時。","how_to_start":"提供催化事件 JSON 或財報分析結果；可選 FMP 補充 OHLCV。","cautions":"不自行搜尋或發掘新聞；須先取得事件脈絡，區分首日與延後觀察候選。"},"stockbee-exhaustion-hammer-screener":{"title":"Stockbee 衰竭錘形篩選","summary":"依品質、流動性、前期動能、拉回深度、下影線與量能篩選賣壓衰竭型態。","when_to_use":"研究接近收盤的錘形反轉、跌破後收復及強勢股拉回時。","how_to_start":"設定 FMP_API_KEY 或提供離線日 OHLCV；盤尾用途需接近收盤的暫定當日 K 棒。","cautions":"盤尾暫定 K 棒尚未完成；須依市場及風險距離條件篩選。"},"stockbee-momentum-burst-screener":{"title":"Stockbee 動能爆發篩選","summary":"以 4% 突破、美元幅度突破、振幅與量能擴張篩選三至五日動能型態。","when_to_use":"研究短期波段突破、每日型態品質或強勢股候選時。","how_to_start":"設定 FMP_API_KEY，安裝指定交易日曆套件；或提供離線 OHLCV 與歷史 as-of 日期。","cautions":"歷史資料須指定已完成交易日；候選仍須通過型態及風險條件。"},"stockbee-setup-fluency-trainer":{"title":"Stockbee 型態熟練訓練","summary":"建立動能型態案例庫，追蹤三日及五日報酬、MFE、MAE、停損與群組統計。","when_to_use":"複習失敗候選、錯過交易或訓練辨識型態時。","how_to_start":"提供動能篩選 JSON 與 OHLCV；可選 FMP 更新結果，保存 model_book.jsonl。","cautions":"盲測回放需收盤後產生的 VCP 報告及離線歷史資料。"},"strategy-pivot-designer":{"title":"策略轉向設計器","summary":"辨識回測迭代停滯，提出不同策略架構以探索同一市場假說。","when_to_use":"參數調整停滯、過度擬合、交易成本侵蝕優勢或尾部風險過高時。","how_to_start":"提供回測迭代歷史 JSON 與原策略草稿 YAML；需 Python、PyYAML。","cautions":"轉向提案是新研究方向，非已驗證改善。"},"technical-analyst":{"title":"技術分析師","summary":"依週線圖表分析趨勢、支撐壓力、可能反轉與情境；另支援逆勢確認模式。","when_to_use":"提供股票、指數、加密貨幣或外匯週線圖，需客觀技術分析時。","how_to_start":"提供週線圖表；一般圖表分析免 API 金鑰。","cautions":"逆勢確認僅提供判定；資料不足不得推進，不能單獨作為交易建議。"},"theme-detector":{"title":"市場主題偵測器","summary":"跨產業辨識強弱市場主題、敘事及產業輪動。","when_to_use":"查詢熱門或降溫主題、產業輪動及主題投資研究對象時。","how_to_start":"安裝指定套件，使用 FINVIZ 公開或 Elite 模式；可搭配 FMP。","cautions":"有倖存者偏誤，公開 FINVIZ 可能延遲 15 分鐘；主題分類及 ETF 清單有涵蓋限制。"},"trade-hypothesis-ideator":{"title":"交易假說發想器","summary":"將市場資料、交易紀錄與日誌整理為可否證、具優先順序的策略假說。","when_to_use":"發現可能優勢、希望把質化觀察轉成量化實驗時。","how_to_start":"提供含 trade_log、journal_snippets、market_data 或 observations 的 JSON；免金鑰。","cautions":"假說須能被否證並設有淘汰條件，不等同已證明的策略。"},"trade-performance-coach":{"title":"交易績效教練","summary":"檢討已結案與部分出場交易的流程遵循、風險紀律及執行品質，整理下次操作規則。","when_to_use":"交易結束、部分出場或月度回顧，需檢查行為及執行品質時。","how_to_start":"提供 thesis 紀錄、事後檢討、原計畫、實際交易與風險規則；免付費 API。","cautions":"不得推斷人格或提供心理診斷；行為標記須連結證據，不提供個股交易建議。"},"trader-memory-core":{"title":"交易論點記憶核心","summary":"追蹤投資論點從篩選構想到進場準備、持有、結案與事後檢討的生命週期。","when_to_use":"篩選後建立論點、附加部位計算、定期複查或結案時。","how_to_start":"提供篩選報告或交易行動；需 Python 3.10+、PyYAML、jsonschema，可選 FMP 計算 MAE/MFE。","cautions":"FMP 為選用，僅供事後 MAE/MFE 計算；狀態紀錄須符合資料結構。"},"trading-skills-navigator":{"title":"交易技能導航器","summary":"依自然語言交易目標推薦適合的流程、技能組合、API 方案與設定路徑。","when_to_use":"不知道從何開始，或需要區分免付費 API、初學者與特定交易者路徑時。","how_to_start":"描述目標及限制；使用本機 skills-index.yaml 與 workflows YAML 或內附快照。","cautions":"導航器只讀本機中繼資料，不連網；上游技能可能需要各自的 API 金鑰。"},"uptrend-analyzer":{"title":"上升趨勢廣度分析","summary":"以 Monty 上升趨勢比例看板資料分析市場及產業參與程度。","when_to_use":"評估上漲是否廣泛、各產業上升比例或市場廣度時。","how_to_start":"取得 GitHub 公開 CSV；需 Python 3.9+ 與 requests，免 API 金鑰。","cautions":"分析依公開 CSV 資料與更新狀況。"},"us-market-bubble-detector":{"title":"美股泡沫風險偵測","summary":"依修訂版 Minsky/Kindleberger 架構，以量化指標評估市場泡沫風險。","when_to_use":"檢視市場泡沫疑慮、IPO 熱潮、媒體狂熱或新技術敘事時。","how_to_start":"提供實測指標值，或從原文列出的資料來源蒐集；免 API 金鑰。","cautions":"第一階段須以實測資料為準，不以主觀印象取代指標。"},"us-stock-analysis":{"title":"美股綜合分析","summary":"分析美股財務、企業品質、估值、技術指標、圖形與同業比較，整理研究報告。","when_to_use":"研究單一美股、比較股票或需要基本面與技術面綜合評估時。","how_to_start":"提供 ticker 或問題，可附財務資料及圖表；需網路搜尋，免 API 金鑰。","cautions":"市場資料依網路搜尋及提供的資料取得。"},"value-dividend-screener":{"title":"價值股息篩選器","summary":"篩選本益比低於 20、股價淨值比低於 2、殖利率至少 3% 且三年成長的美股。","when_to_use":"尋找估值合理、具股息收入與基本面成長的股票時。","how_to_start":"設定 FMP_API_KEY；可用 FINVIZ 模式或具股票篩選端點權限的 FMP 方案。","cautions":"FMP 免費方案不含股票篩選端點；FINVIZ Elite 為建議而非必要。"},"vcp-screener":{"title":"VCP 篩選器","summary":"依 Mark Minervini 的波動收縮型態，篩選 S&P 500 的緊密整理及突破候選。","when_to_use":"研究 VCP、第二階段動能、明確風險的突破候選或歷史型態時。","how_to_start":"設定 FMP_API_KEY；預設前 100 檔，可指定全 S&P 500 或個股歷史研究。","cautions":"免費額度適用預設篩選；完整 S&P 500 掃描建議付費方案。"},"weekly-performance-digest":{"title":"每週績效摘要","summary":"從已結案交易彙整每週已實現績效、勝率、期望值及來源、出場原因等群組表現。","when_to_use":"週末回顧交易表現，或準備月度回顧與事後檢討時。","how_to_start":"提供 trader-memory-core 的 state/theses/ YAML；需 Python 3.9+ 與 PyYAML，免金鑰。","cautions":"僅彙整已結案交易的已實現績效。"},"us-undervalued-growth-screener":{"title":"美股低估成長篩選器","summary":"以多路徑篩選、前瞻同口徑估值、FCF、稀釋及嚴格稽核研究低估成長股。","when_to_use":"尋找美股中小型 GARP 股票，或在財報及重大事件後更新篩選時。","how_to_start":"設定 FMP_API_KEY 或準備相當市場資料；需可取得 SEC、公司 IR 及官方總體來源。","cautions":"須核對流動性、估值口徑、股權稀釋與週期因素，通過最終評估及發布前稽核；勿公開金鑰。"}},"workflows":{"core-portfolio-weekly":{"name":"核心投資組合每週檢視","when_to_run":"每週一次，通常於週六或週日、下週開盤前檢視長期持股、股息部位與整體配置。","when_not_to_run":"不應每日執行；每日頻繁調整持股會破壞本流程的長期投資架構。","steps":{"1":"取得持股快照（portfolio-manager）","2":"檢視配置及集中度；先完成持股對帳（portfolio-manager）","3":"檢查股息健康度（T1至T5異常）（kanchi-dividend-review-monitor）","4":"決定再平衡行動；確認標的及部位大小（portfolio-manager）","5":"記錄每週檢視結果（trader-memory-core）"},"manual_review":["配置或再平衡檢視前，必須取得已驗證的 reconciliation_report；人工解決差異後重新比對。","目前對帳為人工關卡；歷史重播 fixture 不會執行或強制此關卡。","確認持股快照反映實際券商狀態（Alpaca 或 CSV）。","確認再平衡行動由人工在券商下單，不自動執行。","若 dividend_review_findings 標記 T1 至 T5 問題，須暫緩加碼直到問題解決。"]},"earnings-weekly":{"name":"每週財報後動能檢視","when_to_run":"財報季每週執行，須在 market-regime-daily 已產出非限制性曝險判定後。評估約五週 PEAD 觀察期間內的美股財報反應，篩選強勢個股週線型態，人工確認圖表、計算部位並登錄候選，再考慮人工下單。","when_not_to_run":"若最新 market-regime-daily 的 exposure_decision 為現金優先或限制性，或帳戶熔斷關卡未放行，不得執行。不可追逐財報第一天跳空，該用途屬 stockbee-ep-daily。本流程不是獨立篩選器；評分或階段絕非買進訊號，不會自動下單。","steps":{"1":"檢查帳戶熔斷關卡；是否為 TRADING_ALLOWED？（drawdown-circuit-breaker）","2":"評估近期財報反應（earnings-trade-analyzer）","3":"依評級篩選 PEAD 週線型態；確認 Mode B 與門檻（pead-screener）","4":"人工確認週線；不明確即拒絕（technical-analyst）","5":"計算部位大小（position-sizer）","6":"登錄財報後漂移假設；IDEA 並非下單核准（trader-memory-core）","7":"人工下單前執行交易紀律關卡（pre-trade-discipline-gate）"},"manual_review":["確認 market-regime-daily 的 exposure_decision 允許新增風險後才行動。","評分或計算新候選部位前，確認 circuit_breaker_decision 為 TRADING_ALLOWED。","人工查證各財報結果及展望；本流程不自行發掘或驗證消息。","earnings-trade-analyzer 回溯約28至35天涵蓋 PEAD；僅一週難出現下跌K棒。明設 --max-api-calls，考慮 --min-market-cap。預設200次；日曆每日及市值篩選前每檔各1次，PEAD 每檔再1次；長窗可能以 ZERO_RESULT_REASON=profiles_budget_exhausted 結束。實際呼叫量及方案配額未量測，須自行查核。","以第2步 JSON 執行 pead-screener Mode B；Mode A 可能耗用配額於非美股，不屬本流程。","MONITORING、EXPIRED 僅保留觀察或移除；只有 BREAKOUT、SIGNAL_READY 可進入圖表檢視。","週線圖不明確即拒絕，即使財報評級與 PEAD 階段通過亦同。","僅在停損距離可合理配置部位時，使用下跌 K 棒低點作停損；下單前查核整體部位風險。","人工下單前，確認 pre_trade_discipline_decision 為 GO。","所有訂單均由人工在券商下單，不自動執行。"]},"kanchi-dividend-weekly":{"name":"Kanchi 每週股息候選研究","when_to_run":"每週使用 Kanchi 五步法發掘並深入審查新的美國上市股息候選：先篩選殖利率與品質，深入研究強勢候選，進場前登錄完整文件化的交易假設。v1 僅涵蓋美國上市股息股票。","when_not_to_run":"不適用日本或其他非美國上市股息股，v1 不涵蓋也不暗示支援。此流程不宣稱 Kanchi 篩選策略獲利，僅為有紀律的候選發掘程序，不是買進訊號。不用於維護既有持股（由 core-portfolio-weekly 負責），僅發掘及審查新候選。絕不自動下單，每筆買進均由人工在券商下單。","steps":{"1":"篩選高殖利率候選（value-dividend-screener）","2":"篩選股息成長回檔候選（dividend-growth-pullback-screener）","3":"執行 Kanchi 五步審查；僅可執行級別通過（kanchi-dividend-sop）","4":"檢查美國稅務與帳戶配置（kanchi-dividend-us-tax-accounting）","5":"檢查既有持股的強制檢視觸發條件（kanchi-dividend-review-monitor）","6":"登錄候選假設並連結研究備忘錄；成交前不得 ACTIVE（trader-memory-core）"},"manual_review":["HOLD-REVIEW、STEP1-RECHECK 或 FAIL 判定一律阻擋，不得進入部位計算或假設登錄。","第3步手寫單頁備忘錄（references/stock-note-template.md），不在 kanchi_candidates JSON。存檔、登錄 IDEA 後呼叫 thesis_store.link_report(state_dir,thesis_id,\"kanchi-dividend-sop\",<memo_path>,date)，否則 linked_reports 無備忘錄。","不自動下單或轉為 ACTIVE；每筆成交均人工在券商操作，再以 open-position 記錄。","第1至2步篩選器為選用；人工提供 ticker 清單同樣可進入第3步。","第4步稅務及帳戶配置僅供參考，非權威結論；行動前向稅務專業人士或券商、保管機構實際報表查證。","第4步須提供符合連結規格的 tax_holdings_input，不可直接將原始篩選列作為稅務持股輸入。","若第5步將既有持股標為 WARN 或 REVIEW，僅暫停該標的加碼，不觸發自動賣出。","第5步需符合較完整連結規格的 review_monitor_input；僅有 ticker 不足，應跳過選用步驟而非捏造證據。","篩選輸出存於各技能的 logs/，而非共用 reports/；串接時將產物 ID 視為邏輯參照，不是實際檔名。","dividend-growth-pullback-screener 指令範例須使用 screen_dividend_growth_rsi.py；儲存庫沒有 screen_dividend_growth.py。"]},"market-regime-daily":{"name":"每日市場狀態判定","when_to_run":"每天考慮新增波段交易風險前執行，於開盤前或開盤後30分鐘內進行。","when_not_to_run":"不可將輸出作為獨立買賣訊號。exposure_decision 是曝險態度（允許、限制、現金優先），而非交易指令。","steps":{"1":"分析市場廣度（market-breadth-analyzer）","2":"分析上升趨勢參與率（uptrend-analyzer）","3":"檢查市場頭部風險（選用，需 FMP 金鑰）（market-top-detector）","4":"判定曝險態度；允許、限制或現金優先？（exposure-coach）"},"manual_review":["確認不將輸出當作買賣訊號。","確認曝險應降低、維持或提高。","若 exposure_decision 為限制性，暫緩執行 swing-opportunity-daily。"]},"monthly-performance-review":{"name":"每月交易績效檢討","when_to_run":"每月第一個週末，檢討上月已平倉部位、未平倉假設健康度及流程改善，完成計畫、交易、紀錄、檢討、改善的循環。","when_not_to_run":"即使虧損月份也不可跳過，這時更需要檢討。不要每週執行；月度頻率是刻意設計以過濾雜訊。","steps":{"1":"彙整當月交易與交易假設（trader-memory-core）","2":"檢討月度重複模式；分類並記錄根因（signal-postmortem）","3":"檢視月度流程、風險與行為，決定下月規則（trade-performance-coach）","4":"透過回測重新驗證假設（backtest-expert）","5":"檢查哪些技能有幫助或造成負面影響（dual-axis-skill-reviewer）","6":"產出決策紀錄及規則變更；不直接啟用規則（trader-memory-core）"},"manual_review":["區分流程改善（規則變更）與偶發結果（隨機性）。","交易端規則變更適用於交易者下月行為。","技能端改善僅是儲存庫改善候選，未必實施。","應願意刪除或降級無效規則，而非只新增規則。","第6步產物不會啟用規則；須後續明確執行 pre-trade-discipline-gate 的 manage_approved_rules.py activate。","第6步前對剛結束且核定規則生效的月份執行 pre-trade-discipline-gate 的 review_rule_adherence.py --month <month>。逐條判定須重審規則的保留、延長、退役或取代，記入第6步，僅用 manage_approved_rules.py 套用。計數為自行回報的關卡確認，不能僅依未放行比率改規則。"]},"multi-asset-opportunity-daily":{"name":"每日多資產機會研究","when_to_run":"僅在 market-regime-daily 產出非限制性曝險判定後執行。掃描總體、市場主題及新聞，發掘股票、以股票代理的商品及選擇權等多資產構想，整合為排序假設卡。","when_not_to_run":"當最新 market-regime-daily 的 exposure_decision 為現金優先時不得執行。不可將假設卡視為買賣訊號；其標記 manual_review_required，任何資金移動前須經人工核准。外匯輸出僅供研究，絕不可串接至券商。","steps":{"1":"更新總體市場狀態背景（macro-regime-detector）","2":"偵測熱門主題及產業輪動（theme-detector）","3":"掃描新聞與催化因素（market-news-analyst）","4":"整合排序假設卡；確認總體與主題一致及定價差距（trade-hypothesis-ideator）","5":"依風險計算假設卡的部位大小（position-sizer）","6":"儲存 IDEA 或 ENTRY_READY；人工審核狀態變更（trader-memory-core）"},"manual_review":["確認總體簡報不與 market-regime-daily 的 exposure_decision 矛盾。","確認每張假設卡均有書面假設及淘汰條件。","確認部位大小符合投資組合個別部位及產業風險上限。","外匯相關輸出須確認 research_only=true，絕不可串接券商。","確認 IDEA 至 ENTRY_READY 的狀態變更明確且經檢視。"]},"portfolio-holdings-review":{"name":"本地持股配置檢視","when_to_run":"免金鑰檢視本地美元股票 CSV 或已儲存的 Alpaca 持股快照。向 portfolio-manager/scripts/review_csv.py 提供實際檔案與帶時區的來源時間戳，讀取有限的配置報告。","when_not_to_run":"不適用完整帳戶風險、現金、權益、槓桿、績效、股息健康度、交易建議或券商與記憶對帳。完整券商分析請使用有對帳關卡的 core-portfolio-weekly。","steps":{"1":"驗證本地持股並檢視總持股配置（portfolio-manager）"},"manual_review":["執行 review_csv.py，帶入 --input PATH --as-of TIMESTAMP --output-dir reports/UNIQUE-RUN；僅已儲存 Alpaca 資料使用 --input-format alpaca-json。","人工確認輸入身分、來源日期、價格及單一帳戶範圍；Navigator 不會檢查檔案。","閱讀 JSON 與 Markdown 的限制；總持股權重不等於帳戶曝險，亦不授權交易。","不可呼叫券商工具、下單、寫入 trader-memory 紀錄或繞過完整流程的對帳關卡。","個人輸入與報告須保留於本地；隨附的重播輸入為虛構資料。"]},"shapiro-contrarian":{"name":"Shapiro 反向期貨研究","when_to_run":"每週於 CFTC COT 報告公布後執行（美東週五約15:30公布週二部位）。掃描約65個期貨市場的投機部位極端值，僅在消息反應失敗與週線價格反轉均確認後，產出按合約口數計算的反向計畫。","when_not_to_run":"不可盤中執行或頻率高於每週；COT 每週更新，交易優勢源於部位而非盤中波動。不可單憑擁擠極端值行動，須擁擠、消息反應失敗及價格行為全數 CONFIRMED，關卡達 READY_FOR_PLAN 才能計算部位。不適用股票，COT 僅涵蓋 CFTC 期貨市場。","steps":{"1":"篩選 COT 擁擠極端市場；僅極端值進入下一步（cot-contrarian-detector）","2":"檢查消息反應失敗；僅 CONFIRMED 通過（news-reaction-failure-analyzer）","3":"確認週線反轉與波段停損；資料不足即拒絕（technical-analyst）","4":"整合反向型態關卡；僅 READY_FOR_PLAN 通過（contrarian-setup-gate）","5":"計算期貨部位口數（futures-position-sizer）","6":"登錄反向假設、附加部位及證據；成交前不轉 ACTIVE（trader-memory-core）"},"manual_review":["COT 資料落後3天（週二快照、週五公布），應視為週二收盤部位，非即時資料。","擁擠是先決條件而非交易訊號，計算部位前須同時確認消息反應失敗及價格行為。","消息反應失敗事件須來自第一手或通訊社來源，具真實網址，不可捏造；INSUFFICIENT_EVIDENCE 不得進入下一步。","計算部位前確認 setup_status 為 READY_FOR_PLAN；計算器會拒絕未就緒關卡，若拒絕須查核原因。","第5步除 contrarian_setup_gate_report 外，--entry、--account-size、--risk-pct 均須由操作者提供，即使關卡交接模式亦同。關卡及計算器皆不推導這些值，先蒐集再執行 futures-position-sizer。","下單前查核合約口數及每口風險，確認整體部位風險在預算內。","期貨保證金依券商及時間而異，本流程不計算；交易前向券商確認原始及維持保證金。","所有訂單均由人工在券商下單，不自動執行；contrarian-position-monitor 上線前，COT 正常化、停損與假設失效均須人工監控。","關卡 entry_trigger 或計畫進場並非實際成交。保留 SIZED 報告（含計畫進場）；人工登錄來源也保留 origin.raw_provenance.entry_price。真實成交前不得寫入 entry.actual_price。","券商實際成交前不可用 open-position 轉為 ACTIVE；第6步只到 IDEA／ENTRY_READY 並附加期貨部位，絕不自動下單。"]},"stockbee-20pct-study-daily":{"name":"Stockbee 每日20%漲跌研究","when_to_run":"於美股收盤後或歷史研究回補時執行，辨識正負20%波動事件、分類事件背景、更新已到期結果，累積劇烈波動案例庫。","when_not_to_run":"不得作為買賣訊號流程或自動執行系統。不可從小樣本、僅含目前標的的股票池，或未說明倖存者偏誤及資料品質的事件提升新規則。","steps":{"1":"掃描每日正20%及負20%波動事件（stockbee-20pct-study）","2":"分類催化因素、圖表背景、主題聚集及風險標記（stockbee-20pct-study）","3":"更新既有20%研究紀錄已到期的後續結果（stockbee-20pct-study）","4":"彙整群組並匯出優勢提示；判定研究或僅記錄（stockbee-20pct-study）","5":"記錄接受、拒絕或待更多案例的研究發現（trader-memory-core）"},"manual_review":["接受任何型態前，檢視代表性成功與失敗圖表。","區分觀察、研究假設及可執行交易計畫。","若回補僅含現有標的而未納入下市標的，須標記倖存者偏誤。","提升群組規則前，須具明確樣本數門檻。","將接受的經驗納入 monthly-performance-review，不隨意更改規則。"]},"stockbee-ep-daily":{"name":"Stockbee 每日 EP 事件轉折","when_to_run":"在財報或新聞密集日、且市場狀態流程已允許新增風險後執行，或出現重大催化事件時臨時執行。分類第一天 EP 候選，判定當日可執行、延後 EP 觀察或 PEAD 交接。","when_not_to_run":"不得在無催化因素輸入時盲目篩選股票。不可繞過市場狀態關卡、圖表驗證、部位計算及人工催化因素查核。","steps":{"1":"檢查帳戶熔斷關卡；是否為 TRADING_ALLOWED？（drawdown-circuit-breaker）","2":"選用財報候選掃描（earnings-trade-analyzer）","3":"選用動能確認掃描（stockbee-momentum-burst-screener）","4":"分析第一天 EP 候選；確認重大催化及價量（stockbee-episodic-pivot-analyzer）","5":"驗證 EP 圖表品質及當日低點風險（technical-analyst）","6":"計算 EP 部位大小（position-sizer）","7":"建立選用 EP 交易計畫（breakout-trade-planner）","8":"登錄 EP 假設、延後觀察或略過（trader-memory-core）","9":"人工下單前執行 EP 交易紀律關卡（pre-trade-discipline-gate）"},"manual_review":["確認 market-regime-daily 允許新增風險後才行動。","分析新 EP 交易風險前，確認 circuit_breaker_decision 為 TRADING_ALLOWED。","人工驗證催化因素；本流程不自行發掘新聞或驗證其真實性。","僅分析師觀點或僅市場故事的 EP 品質較低，除非價量確認格外強勁。","僅當停損距離可合理配置部位時，才以 EP 當日低點為預設停損參考。","將漲幅過度延伸的財報或展望 EP 交給 PEAD 監控，不追逐第一天行情。","人工下單前確認 pre_trade_discipline_decision 為 GO；觀察及 PEAD 交接候選不可視為下單核准。","所有訂單均由人工在券商下單，不自動執行。"]},"stockbee-fluency-loop":{"name":"Stockbee 型態訓練循環","when_to_run":"stockbee-momentum-burst-screener 產出候選報告後執行，並於3日及5個交易日觀察窗到期後再執行。建立動能爆發案例庫，以改善交易者的型態辨識。","when_not_to_run":"不得用於交易執行或訊號服務。不可由極小樣本改變交易規則；提升或篩除型態標籤前，須有足夠到期案例及人工圖表檢視。","steps":{"1":"匯入最新 Stockbee 動能爆發候選（stockbee-setup-fluency-trainer）","2":"更新已到期3日及5日結果（stockbee-setup-fluency-trainer）","3":"彙整型態群組及規則候選；人工檢視代表圖表（stockbee-setup-fluency-trainer）","4":"記錄接受的經驗或待驗證觀察（trader-memory-core）"},"manual_review":["接受規則變更前，檢視代表性成功及失敗圖表。","區分證據與執行決策；本流程記錄型態行為，非實際損益。","明列樣本數門檻，尤其在市場狀態改變時。","將接受的經驗納入 monthly-performance-review，不每日隨意新增規則。"]},"strategy-research-pipeline":{"name":"離線策略研究管線","when_to_run":"使用具日期的本地 EOD OHLCV Parquet 進行離線研究，偵測研究提案、擷取提示，並以相同檔案與基準日期再次偵測。只有獨立回測已產出對應確切策略及資料期間的可追溯指標後，才評估最終提案。","when_not_to_run":"不可使用無日期或未驗證的歷史資料、缺少回測指標，或取用其他提案的指標。本流程不執行回測、不匯出至外部管線、不核准策略，也不下單。","steps":{"1":"以本地 OHLCV 偵測初始候選（edge-candidate-agent）","2":"擷取具日期的確定性交易優勢提示（edge-hint-extractor）","3":"以同檔案、同日期及提示重跑；無值得測試提案即停止（edge-candidate-agent）","4":"評估獨立回測指標；缺失或不符即 HOLD（backtest-expert）"},"manual_review":["兩次偵測須用相同本地 --ohlcv Parquet 及 --as-of 日期；edge-hint-extractor 亦用同 --as-of，確認 hints.yaml 記錄。各次寫入獨立目錄，第二次以 --hints 帶第2步 hints.yaml。不可帶 --export-strategies-dir 或 --pipeline-root。","隨結果保留最終提案 ID、股票池、資料期間、成本假設及獨立回測指標來源。","向 backtest-expert 提供 total-trades、win-rate、avg-win-pct、avg-loss-pct、max-drawdown-pct、years-tested、num-parameters；僅實際模擬交易摩擦才用 --slippage-tested。缺失或無法連結的指標在評估前即 HOLD。","獨立檢查前視、倖存者偏誤及樣本外證據；評分 CLI 不驗證這些項目。未知即 HOLD。","研究提案與評估保留於本地，不會自動匯出外部管線、寫入即時 API、下券商訂單或作真實資金決策。"]},"swing-opportunity-daily":{"name":"每日波段交易機會研究","when_to_run":"僅在 market-regime-daily 產出非限制性曝險判定後執行，辨識波段交易候選並建立進場計畫。","when_not_to_run":"若最新 market-regime-daily 的 exposure_decision 為現金優先或限制性，不得執行。不可在無市場狀態關卡時當作獨立篩選器。","steps":{"1":"檢查帳戶熔斷關卡；是否為 TRADING_ALLOWED？（drawdown-circuit-breaker）","2":"執行 VCP 篩選（vcp-screener）","3":"執行 Stockbee 動能爆發篩選（stockbee-momentum-burst-screener）","4":"執行 Stockbee 賣壓耗竭錘形篩選（stockbee-exhaustion-hammer-screener）","5":"執行 CANSLIM 篩選（canslim-screener）","6":"交叉檢查市場主題（theme-detector）","7":"人工驗證週線型態、回檔背景及風險距離（technical-analyst）","8":"計算部位大小（position-sizer）","9":"建立進場計畫（breakout-trade-planner）","10":"登錄交易假設；確認單筆及整體風險（trader-memory-core）","11":"人工下單前執行交易紀律關卡（pre-trade-discipline-gate）"},"manual_review":["確認 market-regime-daily 的 exposure_decision 允許新增風險後才行動。","篩選或計算新候選部位前，確認 circuit_breaker_decision 為 TRADING_ALLOWED。","週線型態不清楚即拒絕，即使篩選器已通過。","Stockbee 動能爆發輸出僅用於產生候選，須驗證圖表及風險距離。","Stockbee 賣壓耗竭錘形輸出僅用於產生候選，須確認回檔不是由破壞假設的消息所致，並查核至當日低點的風險。","任何下單前，確認整體部位風險在預算內。","人工券商下單前，確認 pre_trade_discipline_decision 為 GO。","所有訂單均由人工在券商下單，不自動執行。"]},"trade-memory-loop":{"name":"交易記憶檢討循環","when_to_run":"每次部位平倉時（全部或部分出場）執行，記錄結果、產出事後檢討，選用流程、風險、執行與行為教練檢視，亦可選用回測重新驗證原始假設。","when_not_to_run":"部位尚未平倉前不得執行，應直接用 trader-memory-core 更新未平倉假設。即使獲利，平倉後也不可跳過本循環。","steps":{"1":"記錄已平倉交易結果（trader-memory-core）","2":"產出事後檢討；分類並記錄結果根因（signal-postmortem）","3":"檢視流程、風險及行為模式；決定下次規則（trade-performance-coach）","4":"透過回測重新驗證假設（backtest-expert）","5":"將經驗附加至日誌（trader-memory-core）"},"manual_review":["如實判斷獲利源於交易假設或運氣。","如實判斷虧損源於假設缺陷或執行不佳。","不要把隨機性合理化為技能或失敗。"]}}},"tierLabels":{"A":"純計算（可離線；部分有選用金鑰）","B":"公開資料（免付費金鑰）","C":"需付費金鑰（FMP／FINVIZ／Alpaca）","D":"需 LLM 判讀（網搜／圖表／無腳本）"},"repo":"https://github.com/siegfydj/claude-trading-skills"};

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==='class') e.className=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v!==false && v!=null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()){ if (k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
  return e;
}
